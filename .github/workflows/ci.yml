name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Scan history, not just the tip. A key committed and then removed is
          # still a leaked key.
          fetch-depth: 0

      # The action picks its own --log-opts from the event type, and on a push
      # after the first it passes `-1`: one commit. A green run then proves
      # nothing about history, which is exactly what a secret scan is for. It is
      # kept for its pull-request diff behaviour and its SARIF upload, and the
      # full-history guarantee is made explicitly below rather than assumed.
      - name: Scan the pushed range
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install gitleaks
        run: |
          version=8.24.3
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # Every commit reachable from any ref, stated as an argument so the scope
      # is visible in the log rather than inferred from the event. A key that was
      # committed and later removed is still a leaked key.
      - name: Scan the entire history
        run: gitleaks detect --redact --no-banner --log-opts=--all --exit-code 2

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Fails on high and critical only. Failing on every low-severity advisory
      # in a transitive dependency trains people to ignore the job.
      - name: Audit npm dependencies
        run: pnpm audit --audit-level high

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/ai/uv.lock

      # `--skip-editable` excludes clientatlas-ai itself, which uv installs
      # editable and which is not on PyPI. `--strict` is deliberately not used:
      # it fails when anything could not be audited, which our own package
      # always satisfies, so the job would fail permanently for a non-finding.
      # Real vulnerabilities still produce a non-zero exit.
      - name: Audit Python dependencies
        working-directory: services/ai
        run: |
          uv sync --all-groups --frozen
          uv run pip-audit --skip-editable

  node:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  python:
    name: Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/ai/uv.lock

      - name: Install
        run: uv sync --all-groups --frozen

      # Run from the repository root, not from services/ai. `evals/` is Python
      # too, and it sits outside every package, so a service-scoped run never
      # looked at it — three scripts had accumulated lint failures that nothing
      # could have reported. The root ruff.toml extends this service's rules so
      # there is still one place where they are decided.
      - name: Format
        working-directory: ${{ github.workspace }}
        run: uv run --project services/ai ruff format --check .

      - name: Lint
        working-directory: ${{ github.workspace }}
        run: uv run --project services/ai ruff check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest
  integration:
    name: Isolation and retrieval
    runs-on: ubuntu-latest

    # Runs the real Supabase stack rather than a bare PostgreSQL container.
    # It is slower, and it is the only way the storage-policy tests mean
    # anything: those assert against the actual Storage service, and a
    # substitute would be testing a substitute.
    env:
      MIGRATION_DATABASE_URL: postgresql://clientatlas_migration:local_migration_only@127.0.0.1:54322/postgres
      RUNTIME_DATABASE_URL: postgresql://clientatlas_runtime:local_runtime_only@127.0.0.1:54322/postgres
      WORKER_DATABASE_URL: postgresql://clientatlas_worker:local_worker_only@127.0.0.1:54322/postgres
      TEST_DATABASE_URL: postgresql://clientatlas_test:local_test_only@127.0.0.1:54322/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Applies supabase/migrations (roles, extensions) and supabase/seed.sql
      # (local role passwords) as part of starting up.
      - name: Start Supabase
        run: supabase start

      # Use credentials emitted by the stack this job actually started. Newer
      # local stacks generate a different JWT secret, so the old published demo
      # tokens can be correctly shaped and still fail every Auth request.
      - name: Read local Supabase credentials
        run: |
          supabase status -o json \
            | jq -r 'to_entries[] | select(.key == "API_URL" or .key == "ANON_KEY" or .key == "SERVICE_ROLE_KEY" or .key == "JWT_SECRET") | "\(.key)=\(.value)"' \
            >> "$GITHUB_ENV"

      - name: Configure application Auth environment
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"

      - name: Apply tenant schema
        run: pnpm --filter @clientatlas/database run db:migrate

      # storage.objects is owned by supabase_storage_admin, and postgres is
      # neither its owner nor a member of that role, so this needs the one
      # superuser on the stack.
      - name: Apply storage policies
        run: |
          docker exec -i supabase_db_clientatlas \
            psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            < supabase/storage-policies.sql

      - name: Integration tests
        run: pnpm --filter @clientatlas/product-api run test:integration

      # Retrieval quality, gated rather than merely reported.
      #
      # `measure:retrieval` runs under its own vitest config and was therefore
      # invoked by nothing in CI: recall and evidence completeness could regress
      # to zero while every job stayed green. It asserts that fusion beats its
      # own vector half and beats an exact vector-only scan, on both recall@10
      # and complete@10, so a change that quietly breaks ranking fails here.
      #
      # It runs after the integration suite on purpose. Those tests truncate
      # `organizations ... cascade` and destroy any seeded corpus, so the corpus
      # is loaded afterwards; the measurement fails loudly on an absent or empty
      # one rather than passing at 0 >= 0.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/ai/uv.lock

      # The real MiniLM, not the deterministic provider. Deterministic vectors
      # are correctly shaped and meaningless, so a recall number measured with
      # them would be noise presented as a gate.
      - name: Install the embedding model dependencies
        working-directory: services/ai
        run: uv sync --all-groups --extra ml --frozen

      - name: Prepare the evaluation corpus
        working-directory: services/ai
        run: uv run python ../../evals/prepare_corpus.py gitlab-handbook-v1

      - name: Load the corpus
        run: pnpm --filter @clientatlas/product-api exec node scripts/load-corpus.mjs gitlab-handbook-v1

      - name: Measure retrieval
        run: pnpm --filter @clientatlas/product-api run measure:retrieval

      # The browser, against a JWKS-configured server of its own.
      #
      # The suite above mints HS256 tokens by hand — that is how it produces
      # expired, forged and wrong-role tokens Supabase would never issue — and
      # the verifier accepts one key family at a time. Those two needs do not
      # conflict; they just cannot share a process, so Playwright starts its own
      # with SUPABASE_JWKS_URL set and signs in for real.
      - name: Install Playwright browsers
        run: pnpm --filter @clientatlas/product-api exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm --filter @clientatlas/product-api run test:e2e

      # Kept whether or not the run passed, because a flake that vanishes is a
      # flake nobody fixes. Traces and video are only written on failure.
      - name: Browser test artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/product-api/playwright-report/
            apps/product-api/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Supabase logs on failure
        if: failure()
        run: supabase status || true
