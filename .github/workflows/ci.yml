name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Scan history, not just the tip. A key committed and then removed is
          # still a leaked key.
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Fails on high and critical only. Failing on every low-severity advisory
      # in a transitive dependency trains people to ignore the job.
      - name: Audit npm dependencies
        run: pnpm audit --audit-level high

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/ai/uv.lock

      # `--skip-editable` excludes clientatlas-ai itself, which uv installs
      # editable and which is not on PyPI. `--strict` is deliberately not used:
      # it fails when anything could not be audited, which our own package
      # always satisfies, so the job would fail permanently for a non-finding.
      # Real vulnerabilities still produce a non-zero exit.
      - name: Audit Python dependencies
        working-directory: services/ai
        run: |
          uv sync --all-groups --frozen
          uv run pip-audit --skip-editable

  node:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  python:
    name: Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/ai/uv.lock

      - name: Install
        run: uv sync --all-groups --frozen

      # Run from the repository root, not from services/ai. `evals/` is Python
      # too, and it sits outside every package, so a service-scoped run never
      # looked at it — three scripts had accumulated lint failures that nothing
      # could have reported. The root ruff.toml extends this service's rules so
      # there is still one place where they are decided.
      - name: Format
        working-directory: ${{ github.workspace }}
        run: uv run --project services/ai ruff format --check .

      - name: Lint
        working-directory: ${{ github.workspace }}
        run: uv run --project services/ai ruff check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest
  integration:
    name: Tenant and storage isolation
    runs-on: ubuntu-latest

    # Runs the real Supabase stack rather than a bare PostgreSQL container.
    # It is slower, and it is the only way the storage-policy tests mean
    # anything: those assert against the actual Storage service, and a
    # substitute would be testing a substitute.
    env:
      MIGRATION_DATABASE_URL: postgresql://clientatlas_migration:local_migration_only@127.0.0.1:54322/postgres
      RUNTIME_DATABASE_URL: postgresql://clientatlas_runtime:local_runtime_only@127.0.0.1:54322/postgres
      TEST_DATABASE_URL: postgresql://clientatlas_test:local_test_only@127.0.0.1:54322/postgres
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      # The Supabase local-stack defaults. Published in Supabase's own docs,
      # identical on every machine, and reach nothing but loopback.
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      SUPABASE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Applies supabase/migrations (roles, extensions) and supabase/seed.sql
      # (local role passwords) as part of starting up.
      - name: Start Supabase
        run: supabase start

      - name: Apply tenant schema
        run: pnpm --filter @clientatlas/database run db:migrate

      # storage.objects is owned by supabase_storage_admin, and postgres is
      # neither its owner nor a member of that role, so this needs the one
      # superuser on the stack.
      - name: Apply storage policies
        run: |
          docker exec -i supabase_db_clientatlas \
            psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            < supabase/storage-policies.sql

      - name: Integration tests
        run: pnpm --filter @clientatlas/product-api run test:integration

      - name: Supabase logs on failure
        if: failure()
        run: supabase status || true
