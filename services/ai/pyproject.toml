[project]
name = "clientatlas-ai"
version = "0.1.0"
description = "ClientAtlas model service: parse, embed, generate. Holds no tenant database access."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
]

# sentence-transformers pulls torch, which is roughly two gigabytes. Keeping it
# out of the default dependency set means CI, the test suite and a first clone
# stay fast; the deterministic embedding provider covers everything that does
# not need real vectors. Install with `uv sync --extra ml` to embed for real.
[project.optional-dependencies]
ml = [
    "sentence-transformers>=3.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.13.0",
    "pip-audit>=2.7.0",
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "S", "T20"]
# ANN401: `Any` is occasionally the honest annotation at a provider boundary.
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# S101: pytest's assert is the point of the file.
# T201: the evaluation baseline exists to print numbers for a human to read.
"tests/*" = ["S101", "T201"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_generics = true
files = ["app", "tests"]

# PyMuPDF ships no py.typed marker, and sentence-transformers is an optional
# extra that is absent in the default environment. Neither is a type error in
# our code, and neither should be able to mask one.
[[tool.mypy.overrides]]
module = ["fitz.*", "sentence_transformers.*"]
ignore_missing_imports = true

# The floor is 3.12, not 3.11. .python-version, the local venv and CI all run
# 3.12, and numpy (via the ML extra) ships stubs using 3.12 `type` statements
# that a 3.11 checker cannot even parse. Claiming 3.11 support that nothing
# verifies was the weaker position.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
